name: Validate public source
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: [self-hosted, Linux, X64, personal-context-isolated]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require pre-provisioned isolated runner dependencies
        run: |
          command -v ffmpeg
          command -v pdftotext
          command -v fc-match
          python -c 'import ctypes.util; assert ctypes.util.find_library("lz4"), "liblz4 is required"'
      - run: python -m pip install -e '.[mcp,messages,images,dev,videos]' pytest
      - run: python -m unittest discover -s tests
      - run: python -m unittest discover -s iphone/tests
      - run: python iphone/tests/upstream_smoke_test.py
      - run: python -m pytest -q tests/saved_video
      - run: python -m build
      - run: python scripts/check_release.py --history

  icloud-native:
    runs-on: [self-hosted, macOS, ARM64, personal-context-isolated]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify native Finder tags and exclusive moves on fictional files
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_icloud_native.py
