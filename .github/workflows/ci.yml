name: Validate public source
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core poppler-utils
      - run: python -m pip install -e '.[mcp,messages,images,dev,videos]' pytest
      - run: python -m unittest discover -s tests
      - run: python -m unittest discover -s iphone/tests
      - run: python iphone/tests/upstream_smoke_test.py
      - run: python -m pytest -q tests/saved_video
      - run: python -m build
      - run: python scripts/check_release.py --history
