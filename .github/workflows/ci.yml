name: Validate public source
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[mcp,messages,images,dev]'
      - run: python -m unittest discover -s tests
      - run: python -m unittest discover -s iphone/tests
      - run: python iphone/tests/upstream_smoke_test.py
      - run: python -m build
      - run: python scripts/check_release.py
