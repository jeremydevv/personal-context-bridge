[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-context-bridge"
version = "0.1.0"
description = "Self-hosted encrypted Apple, Canvas, Health, travel and Obsidian MCP context"
readme = "README.md"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "NOTICE", "third_party/pulshealth/LICENSE", "third_party/pulshealth/NOTICE", "third_party/apple-pim/LICENSE"]
requires-python = ">=3.11"
dependencies = ["cryptography>=44,<51", "httpx>=0.28,<1", "ijson>=3.3,<4"]

[project.optional-dependencies]
mcp = ["mcp>=1.12,<2.0", "sqlcipher3-binary>=0.6,<1.0; sys_platform == 'linux'", "sqlcipher3>=0.5,<1.0; sys_platform == 'darwin'"]
images = ["Pillow>=11,<13"]
dev = ["build>=1.2,<2"]
messages = ["pytypedstream==0.1.0"]

[project.scripts]
personal-context-setup = "personal_context.onboarding:main"
personal-context-canvas = "personal_context.canvas_collect:main"
personal-context = "personal_context.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
personal_context = ["notes_snapshot.js", "contacts_snapshot.js"]
